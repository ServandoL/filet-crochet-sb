# Local development only: log each request, including its body. In prod these
# would put request contents in docker logs.
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# No Cloudflare Access locally; every request is LOCAL_MEMBER_EMAIL, who needs a household in
# household-api's database like anyone else.
local.member-email=${LOCAL_MEMBER_EMAIL:dev@example.com}
