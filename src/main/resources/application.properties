spring.application.name=filet-crochet
server.port=9010
spring.data.mongodb.uri=${MONGO_APP_URL:mongodb://localhost:27017/test}
spring.data.mongodb.database=${MONGO_DATABASE:test}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Cloudflare Access: the "home" Access application's team domain and AUD tag.
access.team-domain=${ACCESS_TEAM_DOMAIN:}
access.aud=${ACCESS_AUD:}

# nginx reaches the API over plain HTTP. Read its X-Forwarded-* headers so the
# API sees the browser's https origin; otherwise every save looks cross-origin
# to the CORS check and gets 403.
server.forward-headers-strategy=framework
